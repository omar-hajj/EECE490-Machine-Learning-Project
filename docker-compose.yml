# `docker compose up --build` starts both services:
#   API   http://localhost:8000/docs
#   Page  http://localhost:8501
# Before the first run, create what is mounted below (see README, Quick start):
#   scripts/run_baselines.py          -> outputs/baselines_confirmed_azm (meter history)
#   scripts/build_serving_bundle.py   -> outputs/serving (model bundle)
#   scripts/walk_forward.py, build_backtest_table.py, analyse_errors.py
#                                     -> Backtest page and Failure gallery
services:
  api:
    build: .
    image: eece490-azm-api
    ports:
      - "8000:8000"
    environment:
      AZM_MODEL_PATH: /app/models/azm_bundle.joblib
    volumes:
      - ./outputs/serving:/app/models:ro
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: eece490-azm-app
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./outputs:/app/outputs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
