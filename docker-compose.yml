# `docker compose up --build` starts the API on http://localhost:8000/docs.
# Build the model first (scripts/backtest_azm.py) so outputs/azm_backtest exists.
# The Streamlit operator page joins this file in Week 2.
services:
  api:
    build: .
    image: eece490-azm-api
    ports:
      - "8000:8000"
    environment:
      AZM_MODEL_PATH: /app/models/azm_demo.joblib
    volumes:
      - ./outputs/azm_backtest:/app/models:ro
    restart: unless-stopped
